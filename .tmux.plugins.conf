### Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'rahulkjoshi/tmux-focus-pane'

# Install tpm if not already installed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

### Plugin settings
set -g @extrakto_insert_key "enter"
set -g @extrakto_copy_key "tab"

# Keep the regular zoom on M-z; M-Z centers the active pane in a temporary
# focus window and restores it when toggled again or when navigating away.
set -g @tmux-focus-toggle '<np> M-Z'
set -g @tmux-focus-install-hooks 'true'
set -g @tmux-focus-install-resize-hooks 'true'

run '~/.tmux/plugins/tpm/tpm'
