### Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'rahulkjoshi/tmux-focus-pane'

# Bootstrap TPM and install configured plugins automatically. `run-shell` is
# intentionally synchronous here so TPM exists before its plugin loader runs.
run-shell "if [ ! -d \"$HOME/.tmux/plugins/tpm\" ]; then git clone https://github.com/tmux-plugins/tpm \"$HOME/.tmux/plugins/tpm\" || exit 1; fi; \"$HOME/.tmux/plugins/tpm/bin/install_plugins\""

### Plugin settings
set -g @extrakto_insert_key "enter"
set -g @extrakto_copy_key "tab"

# Keep the regular zoom on M-z; M-Z centers the active pane in a temporary
# focus window and restores it when toggled again or when navigating away.
set -g @tmux-focus-toggle '<np> M-Z'
set -g @tmux-focus-install-hooks 'true'
set -g @tmux-focus-install-resize-hooks 'true'

run '~/.tmux/plugins/tpm/tpm'
