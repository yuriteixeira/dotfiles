if-shell "uname | grep -q Darwin" \
    'set-option -g @copy_cmd "pbcopy"' \
    'set-option -g @copy_cmd "wl-copy"'

### Misc commands
set -s command-alias[100] copy-pane='run-shell "tmux capture-pane -p -S - | #{@copy_cmd}"; display-message "Copied pane to clipboard!"'
set -s command-alias[101] reload-config='display-message "Reloading..."; source-file ~/.tmux.conf; display-message "Reloaded config!"'
set -s command-alias[102] enter-copy-mode='display-message "Copy mode ON!"; copy-mode'
set -s command-alias[103] open-clipboard-history='display-popup -E -w 80% -h 80% "~/.local/bin/cliphist-fzf"'
set -s command-alias[104] resume-job='send-keys fg C-m'
set -s command-alias[105] clear-pane='send-keys -R; send-keys C-l; clear-history'
set -s command-alias[106] complete-from-pane='run-shell "~/.tmux/plugins/extrakto/scripts/open.sh \"#{pane_id}\""'

### Popup commands
set -s command-alias[107] open-shell='display-popup -w 80% -h 80% -d "#{pane_current_path}" -E $SHELL'
set -s command-alias[108] open-todo='display-popup -w 80% -h 80% -E nvim --cmd "cd %:p:h" ~/Workspaces/github/yuriteixeira/dotfiles/TODO.md'
set -s command-alias[109] edit-tmux-shortcuts='display-popup -w 80% -h 80% -E nvim --cmd "cd %:p:h" ~/Workspaces/github/yuriteixeira/dotfiles/.tmux.shortcuts.conf'
set -s command-alias[110] "open-gitui=display-popup -w 80% -h 80% -d \"#{pane_current_path}\" -E sh -c 'gitui || tmux display \"No git repo in #{pane_current_path}\"'"
set -s command-alias[111] open-scratch='display-popup -w 80% -h 80% -E nvim --cmd "cd %:p:h" ~/Workspaces/github/yuriteixeira/notes/SCRATCH.md'
set -s command-alias[112] open-btop='display-popup -w 80% -h 80% -E btop -t'

### Command discovery
set -s command-alias[113] open-command-prompt='command-prompt'
set -s command-alias[114] list-key-bindings='list-keys'
set -s command-alias[155] pick-shortcut='display-popup -E -w 80% -h 80% -T "Tmux shortcuts" ~/.tmux.shortcuts.fzf'

### Sessions, panes and windows
set -s command-alias[115] show-pane-numbers='display-panes'
set -s command-alias[116] pick-window='choose-tree -w'
set -s command-alias[117] pick-session='choose-tree -s'
set -s command-alias[118] pick-tree='choose-tree'

set -s command-alias[119] kill-current-pane='confirm-before -p "Kill pane #P? (y/n)" kill-pane'
set -s command-alias[120] kill-other-panes='kill-pane -a'
set -s command-alias[121] "kill-current-window=confirm-before -p \"Kill window #W? (y/n)\" \"if-shell '[ #{session_windows} -le 1 ]' 'if-shell \\\"[ \\\\\$(tmux list-sessions | wc -l) -gt 1 ]\\\" \\\"switch-client -n; kill-window\\\" \\\"kill-window\\\"' 'kill-window'\""
set -s command-alias[122] "kill-other-windows=confirm-before -p \"Kill other windows? (y/n)\" \"if-shell '[ #{session_windows} -le 1 ]' 'if-shell \\\"[ \\\\\$(tmux list-sessions | wc -l) -gt 1 ]\\\" \\\"switch-client -n; kill-window -a\\\" \\\"kill-window -a\\\"' 'kill-window -a'\""
set -s command-alias[123] "kill-current-session=confirm-before -p \"Kill session #S? (y/n)\" \"run-shell 'tmux switch-client -n \\\\; kill-session -t \\\"#S\\\"'\""

set -s command-alias[124] new-window-here='new-window -c "#{pane_current_path}"'
set -s command-alias[125] prompt-new-session='command-prompt -I "new-session -s "'
set -s command-alias[126] toggle-pane-zoom='resize-pane -Z'
set -s command-alias[127] equalize-panes='select-layout -E'
set -s command-alias[128] "prompt-rename-session=command-prompt -I \"#S\" \"rename-session -- '%%'\""
set -s command-alias[129] prompt-move-pane='command-prompt -I "move-pane -t "'
set -s command-alias[130] prompt-move-window='command-prompt -I "move-window -t "'
set -s command-alias[131] toggle-pane-sync='set-window-option synchronize-panes; display-message "Mirror input: Sync panes toggled!"'
set -s command-alias[132] split-pane-horizontal='split-window -h -c "#{pane_current_path}"'
set -s command-alias[133] split-pane-vertical='split-window -v -c "#{pane_current_path}"'

set -s command-alias[134] select-last-window='last-window'
set -s command-alias[135] select-next-session='switch-client -n'
set -s command-alias[136] select-previous-session='switch-client -p'
set -s command-alias[137] select-last-session='switch-client -l'

set -s command-alias[138] select-pane-left='select-pane -L'
set -s command-alias[139] select-pane-down='select-pane -D'
set -s command-alias[140] select-pane-up='select-pane -U'
set -s command-alias[141] select-pane-right='select-pane -R'
set -s command-alias[142] resize-pane-left='resize-pane -L 1'
set -s command-alias[143] resize-pane-down='resize-pane -D 1'
set -s command-alias[144] resize-pane-up='resize-pane -U 1'
set -s command-alias[145] resize-pane-right='resize-pane -R 1'

set -s command-alias[146] select-window-1='select-window -t 1'
set -s command-alias[147] select-window-2='select-window -t 2'
set -s command-alias[148] select-window-3='select-window -t 3'
set -s command-alias[149] select-window-4='select-window -t 4'
set -s command-alias[150] select-window-5='select-window -t 5'
set -s command-alias[151] select-window-6='select-window -t 6'
set -s command-alias[152] select-window-7='select-window -t 7'
set -s command-alias[153] select-window-8='select-window -t 8'
set -s command-alias[154] select-window-9='select-window -t 9'
